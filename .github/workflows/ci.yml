name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  programs:
    name: Program unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --workspace --lib --locked

  typescript:
    name: Sealer tests and web type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Threshold sealer vs Acrux node vectors
        run: npm run test:unit
      - name: Web type-check
        run: npx tsc --noEmit -p web
      - name: Web build
        run: npx vite build web
